name: Multi-account Terraform checks

on:
  pull_request:
    paths:
      - "multi-account-cloud-platform/**"
      - ".github/workflows/multi-account-terraform-*.yml"

permissions:
  contents: read

concurrency:
  group: macp-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi-account-cloud-platform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
      - uses: terraform-linters/setup-tflint@v6
      - name: Check formatting
        run: terraform fmt -check -recursive .
      - name: Check documentation
        run: bash tests/check-documentation.sh
      - name: Validate Terraform roots and modules
        run: make validate
      - name: Run Terraform tests
        run: make test
      - name: Run TFLint
        run: tflint --recursive
      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: multi-account-cloud-platform
          severity: HIGH,CRITICAL
          exit-code: "1"
